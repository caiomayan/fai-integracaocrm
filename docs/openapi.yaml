components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token permanente do usuário técnico do serviço "CRM Vestibular FAI". Fica só no backend do CRM.
  schemas:
    Erro:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Descrição em português, clara para o usuário final.
      example:
        message: "Já existe um candidato com este e-mail."
    CursosPaginados:
      type: object
      required: [total, pagina, porpagina, totalpaginas, cursos]
      properties:
        total:
          type: integer
        pagina:
          type: integer
        porpagina:
          type: integer
          description: Fixo em 100.
        totalpaginas:
          type: integer
        cursos:
          type: array
          items:
            $ref: '#/components/schemas/Curso'
    Curso:
      type: object
      required: [id, shortname, nome, categoriaid, categoria, visivel, datainicio, datafim]
      properties:
        id:
          type: integer
        shortname:
          type: string
        nome:
          type: string
        categoriaid:
          type: integer
        categoria:
          type: string
        visivel:
          type: boolean
        datainicio:
          type: string
          format: date-time
          nullable: true
        datafim:
          type: string
          format: date-time
          nullable: true
    ProvasDoCurso:
      type: object
      required: [courseid, provas]
      properties:
        courseid:
          type: integer
        provas:
          type: array
          items:
            $ref: '#/components/schemas/Prova'
    Prova:
      type: object
      required: [id, cmid, nome, visivel, notamaxima, tentativaspermitidas, metodonota, abertura, fechamento]
      properties:
        id:
          type: integer
          description: Id da prova (`quizid`).
        cmid:
          type: integer
        nome:
          type: string
        visivel:
          type: boolean
        notamaxima:
          type: number
        tentativaspermitidas:
          type: integer
          description: 0 = ilimitado.
        metodonota:
          type: string
          enum: [maior, media, primeira, ultima]
        abertura:
          type: string
          format: date-time
          nullable: true
        fechamento:
          type: string
          format: date-time
          nullable: true
    NovaTentativa:
      type: object
      required: [quizid, userid, tentativaspermitidas, prazo]
      properties:
        quizid:
          type: integer
        userid:
          type: integer
        tentativaspermitidas:
          type: integer
          description: Tentativas que o candidato passa a ter (finalizadas + 1).
        prazo:
          type: string
          format: date-time
          nullable: true
          description: Fechamento da prova para esse candidato, se `prazo` foi informado.
    NovoCandidato:
      type: object
      required: [username, password, firstname, lastname, email]
      properties:
        username:
          type: string
          description: Único e em minúsculas (CPF só com dígitos funciona).
        password:
          type: string
          description: Precisa atender à política de senhas do Moodle.
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
          format: email
          description: Único.
        auth:
          type: string
          default: manual
        idnumber:
          type: string
          description: Opcional; usamos o mesmo valor do username.
    UsuarioMoodle:
      type: object
      description: Usuário como o Moodle devolve (campos omitidos nos exemplos).
      properties:
        id:
          type: integer
        username:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        fullname:
          type: string
        email:
          type: string
        auth:
          type: string
        suspended:
          type: boolean
        confirmed:
          type: boolean
      additionalProperties: true
    Candidato:
      type: object
      required: [username, firstname, lastname, email, courseid, nota, concluido, datamatricula, dataprova, dataconclusao, tentativas, podefazerprova]
      properties:
        username:
          type: string
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
        courseid:
          type: integer
        nota:
          type: number
          nullable: true
          description: Total do curso no gradebook, valor bruto; `null` se ainda sem nota.
        concluido:
          type: boolean
          description: Conclusão do curso (depende do cron do Moodle, pode levar alguns minutos após a prova).
        datamatricula:
          type: string
          format: date-time
          nullable: true
          description: Primeira matrícula do candidato no curso (ISO 8601 com fuso).
        dataprova:
          type: string
          format: date-time
          nullable: true
          description: Fim da última tentativa finalizada do questionário; `null` se ainda não fez a prova.
        dataconclusao:
          type: string
          format: date-time
          nullable: true
          description: Quando o curso foi concluído; `null` se não concluiu.
        tentativas:
          type: integer
          description: Tentativas da prova que o candidato finalizou.
        podefazerprova:
          type: boolean
          description: |
            `true` se ele pode iniciar ou continuar uma tentativa agora (matrícula ativa, prova visível e aberta, tentativa
            disponível ou em andamento, considerando a exceção de nova tentativa).
    ResultadoPaginado:
      type: object
      required: [total, pagina, porpagina, totalpaginas, candidatos]
      properties:
        total:
          type: integer
          description: Total de candidatos (já considerando o filtro de data).
        pagina:
          type: integer
          description: Página devolvida.
        porpagina:
          type: integer
          description: Candidatos por página (fixo em 100).
          example: 100
        totalpaginas:
          type: integer
          description: "`ceil(total / porpagina)`; 0 quando não há candidatos."
        candidatos:
          type: array
          items:
            $ref: '#/components/schemas/Candidato'
    RespostaNativa:
      type: object
      description: Resposta nativa do Moodle, sem alterações (resumida nos exemplos).
      additionalProperties: true
  responses:
    NaoAutenticado:
      description: Token ausente, inválido ou expirado.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Sempre `Bearer`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            message: "Token de acesso inválido ou ausente."
    SemPermissao:
      description: A integração não tem permissão para a operação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
            message: "Operação não permitida para esta integração."
    MetodoNaoPermitido:
      description: Método diferente de POST.
      headers:
        Allow:
          schema:
            type: string
          description: Sempre `POST`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
          example:
