openapi: 3.0.3
info:
  title: API de integração CRM ↔ Moodle (Vestibular FAI)
  version: 1.8.5
  description: |
    API JSON para o CRM cadastrar candidatos, matriculá-los no curso do Vestibular e consultar os resultados da prova.
    Ela é servida pelo adaptador `local/faicrm/rest_json.php` do plugin `local_faicrm`, que repassa cada chamada ao
    servidor REST nativo do Moodle (autenticação, permissões e validação são as nativas).

    **Autenticação.** Todas as chamadas levam o token do usuário técnico no header `Authorization: Bearer <token>`.
    O token fica só no backend do CRM; nunca o envie ao navegador do candidato.

    **Formato.** Toda requisição é `POST` com corpo JSON (objeto; `{}` quando a operação não tem parâmetros).
    A operação vai no caminho (`/local/faicrm/rest_json.php/<função>`). Também vale a forma antiga
    `/local/faicrm/rest_json.php?wsfunction=<função>`; se as duas aparecerem, têm de ser iguais, senão a resposta é 400.

    **Erros.** Todo erro responde com o status HTTP adequado e corpo `{"message": "..."}` em português, pronto para
    exibir na tela. O detalhe técnico fica no log do servidor, localizável pelo header `X-Request-Id` da resposta.
    Sucesso sem dados (matricular e desmatricular) responde `204` sem corpo.
  contact:
    name: Equipe de integração FAI
servers:
  - url: https://vestibular.faifaculdade.com.br
    description: Produção
tags:
  - name: Candidatos
    description: Localizar e cadastrar candidatos.
  - name: Matrículas
    description: Matricular e desmatricular candidatos no curso.
  - name: Resultados
    description: Nota, conclusão e datas dos candidatos do curso, com paginação e filtro por data da prova.
  - name: Catálogo
    description: Cursos do Moodle e provas de um curso.
  - name: Recaptação
    description: Liberar (e cancelar) uma nova tentativa da prova para um candidato específico.
  - name: Consultas auxiliares
    description: Funções nativas do Moodle liberadas no serviço, para conferência. As respostas são as nativas (resumidas nos exemplos).
security:
  - bearerAuth: []
paths:
  /local/faicrm/rest_json.php/core_user_get_users_by_field:
    post:
      tags: [Candidatos]
      operationId: localizarCandidato
      summary: Localizar candidato
      description: |
        Procura candidatos por um campo (`username`, `idnumber` ou `id`). Lista vazia (`[]`) quando não existe.
        Função nativa `core_user_get_users_by_field`. O CRM deve localizar antes de criar, pelo CPF (`username` ou
        `idnumber`) ou pelo `id`. A busca por `email` não é suportada: responde `[]` mesmo que a conta exista (o usuário
        técnico não vê e-mails, por privacidade), e o `email` não vem na resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [field, values]
              properties:
                field:
                  type: string
                  enum: [id, idnumber, username]
                  description: Campo da busca.
                values:
                  type: array
                  items:
                    type: string
                  description: Valores procurados.
            examples:
              porUsername:
                summary: Por username (CPF)
                value:
                  field: username
                  values: ["12345678900"]
              porId:
                summary: Por id
                value:
                  field: id
                  values: ["72"]
      responses:
        '200':
          description: Candidatos encontrados (ou lista vazia).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UsuarioMoodle'
              examples:
                encontrado:
                  summary: Candidato encontrado (campos omitidos)
                  value:
                    - id: 1548
                      username: "12345678900"
                      firstname: Maria
                      lastname: da Silva
                      fullname: Maria da Silva
                      auth: manual
                      suspended: false
                      confirmed: true
                      lang: pt_br
                inexistente:
                  summary: Candidato inexistente
                  value: []
        '400':
          description: Corpo ou parâmetros inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semCampo:
                  summary: Sem `field`
                  value:
                    message: "Dados inválidos: o campo campo de busca é obrigatório."
                semValores:
                  summary: Sem `values`
                  value:
                    message: "Dados inválidos: o campo valores é obrigatório."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '413':
          $ref: '#/components/responses/CorpoGrande'
  /local/faicrm/rest_json.php/core_user_create_users:
    post:
      tags: [Candidatos]
      operationId: criarCandidato
      summary: Criar candidato
      description: |
        Cria candidatos (função nativa `core_user_create_users`). Guarde o `id` devolvido.
        `username` e `email` precisam ser únicos: repetir um deles devolve 409 e nada é criado.
        A senha precisa atender à política de senhas do Moodle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [users]
              properties:
                users:
                  type: array
                  minItems: 1
                  items:
                    $ref: '#/components/schemas/NovoCandidato'
            example:
              users:
                - username: "12345678900"
                  password: "Senha@12345"
                  firstname: Maria
                  lastname: da Silva
                  email: maria@email.com
                  auth: manual
                  idnumber: "12345678900"
      responses:
        '200':
          description: Candidatos criados.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Id do candidato no Moodle.
                    username:
                      type: string
              example:
                - id: 1548
                  username: "12345678900"
        '400':
          description: Dados inválidos (campo obrigatório ausente, e-mail inválido, senha fora da política etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                campoObrigatorio:
                  summary: Campo obrigatório ausente
                  value:
                    message: "Dados inválidos: o campo nome é obrigatório."
                jsonInvalido:
                  summary: Corpo que não é um objeto JSON
                  value:
                    message: "O corpo da requisição deve ser um objeto JSON válido."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '409':
          description: Já existe candidato com o mesmo usuário ou e-mail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                usuarioDuplicado:
                  summary: Usuário repetido
                  value:
                    message: "Já existe um candidato com este usuário."
                emailDuplicado:
                  summary: E-mail repetido
                  value:
                    message: "Já existe um candidato com este e-mail."
        '413':
          $ref: '#/components/responses/CorpoGrande'
  /local/faicrm/rest_json.php/enrol_manual_enrol_users:
    post:
      tags: [Matrículas]
      operationId: matricularCandidato
      summary: Matricular candidato
      description: |
        Matricula candidatos no curso (função nativa `enrol_manual_enrol_users`).

        - O `roleid` é **opcional**: sem ele, vale o papel Estudante (`student`), localizado pelo shortname.
          O usuário técnico só pode atribuir o papel Estudante; outro `roleid` devolve 403.
        - Quem **já tem matrícula manual ativa** no curso devolve 409. Matrícula manual **suspensa** é reativada (204);
          matrícula por **outro método** (autoinscrição etc.) não bloqueia: a matrícula manual é criada (204).
        - Com vários itens vale **tudo ou nada**: se um item falhar, nenhum é matriculado.
        - Sucesso: `204`, sem corpo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolments]
              properties:
                enrolments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [userid, courseid]
                    properties:
                      roleid:
                        type: integer
                        description: Papel da matrícula. Padrão Estudante.
                      userid:
                        type: integer
                        description: Id do candidato.
                      courseid:
                        type: integer
                        description: Id do curso.
            examples:
              semRoleid:
                summary: Sem roleid (padrão Estudante)
                value:
                  enrolments:
                    - userid: 1548
                      courseid: 10
              comRoleid:
                summary: Com roleid
                value:
                  enrolments:
                    - roleid: 5
                      userid: 1548
                      courseid: 10
      responses:
        '204':
          description: Matriculado. Sem corpo.
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "Dados inválidos: verifique o campo candidato."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          description: Papel não permitido (o usuário técnico só atribui Estudante) ou sem permissão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                papelNaoPermitido:
                  summary: roleid diferente de Estudante
                  value:
                    message: "Não é permitido matricular com este papel."
                semPermissao:
                  summary: Sem permissão
                  value:
                    message: "Operação não permitida para esta integração."
        '404':
          description: Curso ou candidato inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                curso:
                  summary: Curso inexistente
                  value:
                    message: "Curso não encontrado."
                candidato:
                  summary: Candidato inexistente
                  value:
                    message: "Candidato não encontrado."
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '409':
          description: O candidato já tem matrícula manual ativa no curso. Nada é alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "O candidato já está matriculado neste curso."
        '413':
          $ref: '#/components/responses/CorpoGrande'
  /local/faicrm/rest_json.php/enrol_manual_unenrol_users:
    post:
      tags: [Matrículas]
      operationId: desmatricularCandidato
      summary: Desmatricular candidato
      description: |
        Remove a matrícula **manual** do candidato no curso (função nativa `enrol_manual_unenrol_users`).
        Quem não tem matrícula manual no curso devolve 404. Com vários itens vale **tudo ou nada**.
        Sucesso: `204`, sem corpo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrolments]
              properties:
                enrolments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [userid, courseid]
                    properties:
                      userid:
                        type: integer
                        description: Id do candidato.
                      courseid:
                        type: integer
                        description: Id do curso.
                      roleid:
                        type: integer
                        description: Opcional. Papel a remover; sem ele, todos os papéis da matrícula manual.
            example:
              enrolments:
                - userid: 1548
                  courseid: 10
      responses:
        '204':
          description: Desmatriculado. Sem corpo.
        '400':
          description: Dados inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "Dados inválidos: verifique o campo candidato."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Candidato sem matrícula manual no curso, ou curso/candidato inexistente. Nada é alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semMatricula:
                  summary: Candidato não matriculado
                  value:
                    message: "O candidato não está matriculado neste curso."
                curso:
                  summary: Curso inexistente
                  value:
                    message: "Curso não encontrado."
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '413':
          $ref: '#/components/responses/CorpoGrande'
  /local/faicrm/rest_json.php/local_faicrm_get_resultados_vestibular:
    post:
      tags: [Resultados]
      operationId: consultarResultados
      summary: Resultados do vestibular
      description: |
        Candidatos (estudantes) do curso com **nota**, **conclusão** e **datas**, sempre **100 por página**, em ordem estável
        (sobrenome, nome, id). Função própria do plugin `local_faicrm`, somente leitura.

        - `pagina` começa em 1. Página além da última devolve `candidatos: []` com os metadados corretos.
          Para ler tudo, repita de `pagina` 1 até `totalpaginas`.
        - O tamanho da página é fixo; enviar `porpagina` devolve 400.
        - **Datas.** `datamatricula`, `dataprova` e `dataconclusao` vêm em ISO 8601 com fuso, ou `null`.
          `dataprova` é o fim da **última tentativa finalizada** do questionário.
        - **Filtro por data da prova.** `dataprovade` e `dataprovaate` aceitam só `AAAA-MM-DD` (fuso America/Sao_Paulo):
          o "de" vale a partir de 00:00:00 e o "até" até 23:59:59 do dia. Com filtro, quem não fez a prova fica de fora,
          e `total` e `totalpaginas` respeitam o filtro. Um dia exato: os dois iguais.
        - Curso sem candidatos: `total: 0`, `totalpaginas: 0`, `candidatos: []`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseid]
              properties:
                courseid:
                  type: integer
                  description: Id do curso.
                pagina:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Número da página.
                dataprovade:
                  type: string
                  format: date
                  description: Só candidatos com prova a partir deste dia (00:00:00). Vazio = sem limite.
                dataprovaate:
                  type: string
                  format: date
                  description: Só candidatos com prova até este dia (23:59:59). Vazio = sem limite.
            examples:
              primeiraPagina:
                summary: Primeira página
                value:
                  courseid: 10
              provasDeUmDia:
                summary: Provas de um dia
                value:
                  courseid: 10
                  dataprovade: "2026-10-07"
                  dataprovaate: "2026-10-07"
              segundaPagina:
                summary: Segunda página
                value:
                  courseid: 10
                  pagina: 2
      responses:
        '200':
          description: Página de resultados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoPaginado'
              examples:
                comProva:
                  summary: Candidato que ainda não fez a prova e candidato que concluiu
                  value:
                    total: 2
                    pagina: 1
                    porpagina: 100
                    totalpaginas: 1
                    candidatos:
                      - username: "55500000011"
                        firstname: T
                        lastname: a1
                        email: a1@email.com
                        courseid: 10
                        nota: null
                        concluido: false
                        datamatricula: "2026-10-06T11:38:01-03:00"
                        dataprova: null
                        dataconclusao: null
                        tentativas: 0
                        podefazerprova: true
                      - username: "91791379514"
                        firstname: João
                        lastname: Demonstração
                        email: portal91791379514@email.com
                        courseid: 10
                        nota: 800
                        concluido: true
                        datamatricula: "2026-10-07T10:25:18-03:00"
                        dataprova: "2026-10-07T10:32:10-03:00"
                        dataconclusao: "2026-10-07T10:32:10-03:00"
                        tentativas: 1
                        podefazerprova: false
                semProvas:
                  summary: Filtro por data sem provas
                  value:
                    total: 0
                    pagina: 1
                    porpagina: 100
                    totalpaginas: 0
                    candidatos: []
        '400':
          description: Parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                paginaInvalida:
                  summary: pagina menor que 1
                  value:
                    message: "Dados inválidos: pagina deve ser maior ou igual a 1."
                porpaginaNaoAceito:
                  summary: porpagina enviado
                  value:
                    message: "Dados inválidos: porpagina não é aceito; o serviço usa 100 por página."
                dataInvalida:
                  summary: Data fora do formato
                  value:
                    message: "Dados inválidos: dataprovade deve estar no formato AAAA-MM-DD."
                intervaloInvertido:
                  summary: dataprovade posterior a dataprovaate
                  value:
                    message: "Dados inválidos: dataprovade não pode ser posterior a dataprovaate."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Curso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "Curso não encontrado."
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '413':
          $ref: '#/components/responses/CorpoGrande'
  /local/faicrm/rest_json.php/local_faicrm_listar_cursos:
    post:
      tags: [Catálogo]
      operationId: listarCursos
      summary: Listar cursos
      description: |
        Cursos do Moodle, 100 por página, em ordem de nome e id. **Inclui os ocultos** (`visivel: false`) e exclui a página
        inicial do site. O filtro `visivel` é opcional: `true` só os visíveis, `false` só os ocultos. Datas em ISO 8601 com
        fuso, ou `null`. Função própria do plugin `local_faicrm`, somente leitura.

        Curso **ativo** = `visivel: true` e dentro de `datainicio`/`datafim`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pagina:
                  type: integer
                  minimum: 1
                  default: 1
                  description: Número da página.
                visivel:
                  type: boolean
                  description: Só visíveis (`true`) ou só ocultos (`false`). Sem ele, todos.
            examples:
              todos:
                summary: Todos os cursos, primeira página
                value:
                  pagina: 1
              soVisiveis:
                summary: Só os cursos visíveis
                value:
                  pagina: 1
                  visivel: true
      responses:
        '200':
          description: Página de cursos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursosPaginados'
              example:
                total: 2
                pagina: 1
                porpagina: 100
                totalpaginas: 1
                cursos:
                  - id: 4
                    shortname: OCULTOTMP
                    nome: AAA Oculto tmp
                    categoriaid: 1
                    categoria: Categoria 1
                    visivel: false
                    datainicio: "2026-11-01T00:00:00-03:00"
                    datafim: "2026-12-15T18:30:00-03:00"
                  - id: 2
                    shortname: VEST20271
                    nome: Vestibular 2027.1
                    categoriaid: 1
                    categoria: Categoria 1
                    visivel: true
                    datainicio: null
                    datafim: null
        '400':
          description: Parâmetro inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                paginaInvalida:
                  summary: pagina menor que 1
                  value:
                    message: "Dados inválidos: pagina deve ser maior ou igual a 1."
                visivelInvalido:
                  summary: visivel que não é booleano
                  value:
                    message: "Dados inválidos: verifique o campo visivel."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '413':
          $ref: '#/components/responses/CorpoGrande'
  /local/faicrm/rest_json.php/local_faicrm_listar_provas:
    post:
      tags: [Catálogo]
      operationId: listarProvas
      summary: Listar as provas de um curso
      description: |
        Provas (questionários) do curso, com as regras que valem para a recaptação: `tentativaspermitidas` (0 = ilimitado),
        `metodonota` (`maior`, `media`, `primeira` ou `ultima`: como a nota é calculada com várias tentativas), abertura
        e fechamento (ISO 8601, ou `null`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [courseid]
              properties:
                courseid:
                  type: integer
                  description: Id do curso.
            example:
              courseid: 10
      responses:
        '200':
          description: Provas do curso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvasDoCurso'
              example:
                courseid: 10
                provas:
                  - id: 1
                    cmid: 2
                    nome: Prova Vestibular 2027.1
                    visivel: true
                    notamaxima: 1000
                    tentativaspermitidas: 1
                    metodonota: maior
                    abertura: null
                    fechamento: null
        '400':
          description: Parâmetro obrigatório ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "Dados inválidos: o campo curso é obrigatório."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Curso inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "Curso não encontrado."
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '413':
          $ref: '#/components/responses/CorpoGrande'
  /local/faicrm/rest_json.php/local_faicrm_liberar_nova_tentativa:
    post:
      tags: [Recaptação]
      operationId: liberarNovaTentativa
      summary: Liberar nova tentativa da prova
      description: |
        Dá **uma tentativa a mais** da prova para **um candidato específico**, por meio de uma exceção de usuário nativa do
        Moodle (só ele é afetado). Nada é apagado: as tentativas antigas ficam no histórico, e a nota segue a regra de nota
        da prova (com "maior nota", refazer nunca piora). `prazo` é opcional (`AAAA-MM-DD`, vale até 23:59:59 de Brasília,
        só para esse candidato).

        Regras, **nesta ordem**: prova e candidato existem (404); candidato com matrícula ativa no curso (409); sem tentativa
        em andamento (409); sem tentativa disponível, ou seja, já usou o limite (409 "ainda pode fazer a prova"); `prazo`
        válido e não passado (400); prova encerrada exige `prazo` (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quizid, userid]
              properties:
                quizid:
                  type: integer
                  description: Id da prova (`id` de `listarProvas`).
                userid:
                  type: integer
                  description: Id do candidato.
                prazo:
                  type: string
                  format: date
                  description: Prazo opcional (`AAAA-MM-DD`), até 23:59:59 de Brasília.
            examples:
              semPrazo:
                summary: Sem prazo
                value:
                  quizid: 25
                  userid: 1548
              comPrazo:
                summary: Com prazo
                value:
                  quizid: 25
                  userid: 1548
                  prazo: "2026-12-31"
      responses:
        '200':
          description: Nova tentativa liberada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NovaTentativa'
              example:
                quizid: 25
                userid: 1548
                tentativaspermitidas: 2
                prazo: "2026-12-31T23:59:59-03:00"
        '400':
          description: Prazo inválido ou no passado, ou prova encerrada sem prazo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                prazoInvalido:
                  summary: prazo fora do formato
                  value:
                    message: "Dados inválidos: prazo deve estar no formato AAAA-MM-DD."
                prazoNoPassado:
                  summary: prazo no passado
                  value:
                    message: "Dados inválidos: prazo não pode estar no passado."
                provaEncerrada:
                  summary: prova encerrada sem prazo
                  value:
                    message: "A prova está encerrada: informe um prazo para a nova tentativa."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Prova ou candidato inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                prova:
                  summary: Prova inexistente
                  value:
                    message: "Prova não encontrada."
                candidato:
                  summary: Candidato inexistente
                  value:
                    message: "Candidato não encontrado."
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '409':
          description: Não é possível liberar agora.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                naoMatriculado:
                  summary: Sem matrícula ativa no curso
                  value:
                    message: "O candidato não está matriculado neste curso."
                emAndamento:
                  summary: Tentativa em andamento
                  value:
                    message: "O candidato tem uma tentativa em andamento."
                aindaPode:
                  summary: Ainda tem tentativa disponível
                  value:
                    message: "O candidato ainda pode fazer a prova."
        '413':
          $ref: '#/components/responses/CorpoGrande'
        '503':
          $ref: '#/components/responses/Ocupado'
  /local/faicrm/rest_json.php/local_faicrm_cancelar_nova_tentativa:
    post:
      tags: [Recaptação]
      operationId: cancelarNovaTentativa
      summary: Cancelar a nova tentativa liberada
      description: |
        Desfaz a liberação (remove a exceção do candidato) enquanto ele ainda **não iniciou** a tentativa extra. Sem exceção
        para o candidato devolve 404; se ele já iniciou ou finalizou a tentativa extra, 409. Sucesso: `204`, sem corpo.
        O cancelamento desfaz exatamente o que a liberação fez: tentativas e prazo voltam ao que eram antes (sem exceção,
        se ela não existia). Ajustes feitos pela FAI no Moodle (abertura, prazo, tempo limite ou senha, por exemplo para
        acessibilidade) são mantidos, inclusive um prazo alterado pela FAI depois da liberação. Uma exceção sem
        tentativas (só esses ajustes) não conta como nova tentativa liberada: 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quizid, userid]
              properties:
                quizid:
                  type: integer
                  description: Id da prova.
                userid:
                  type: integer
                  description: Id do candidato.
            example:
              quizid: 25
              userid: 1548
      responses:
        '204':
          description: Liberação cancelada. Sem corpo.
        '400':
          description: Parâmetro obrigatório ausente ou inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "Dados inválidos: o campo prova é obrigatório."
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          description: Prova ou candidato inexistente, ou sem nova tentativa liberada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              examples:
                semExcecao:
                  summary: Sem nova tentativa liberada
                  value:
                    message: "Não há nova tentativa liberada para este candidato."
                prova:
                  summary: Prova inexistente
                  value:
                    message: "Prova não encontrada."
                candidato:
                  summary: Candidato inexistente
                  value:
                    message: "Candidato não encontrado."
        '405':
          $ref: '#/components/responses/MetodoNaoPermitido'
        '409':
          description: O candidato já iniciou a nova tentativa. Nada é alterado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                message: "O candidato já iniciou a nova tentativa."
        '413':
          $ref: '#/components/responses/CorpoGrande'
        '503':
          $ref: '#/components/responses/Ocupado'
